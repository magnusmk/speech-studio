name: Paragraph Mode macOS

on:
  push:
    branches: [feat/voxcpm2-paragraph-mode]
  workflow_dispatch:

concurrency:
  group: paragraph-mode-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    name: Test and build Apple Silicon DMG (self-hosted)
    # Deliberately require GitHub's standard self-hosted macOS/ARM64 labels.
    # Never fall back to a metered GitHub-hosted macOS runner.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VITE_DISABLE_SPEECH_STUDIO_UPDATES: "1"

    steps:
      - name: Check out speech-studio
        uses: actions/checkout@v4
        with:
          path: speech-studio

      - name: Verify self-hosted Apple Silicon toolchain
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: speech-studio/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: speech-studio
        run: pnpm install --frozen-lockfile

      - name: Stage official v0.0.11 sidecar and MLX metallib
        env:
          SPEECH_STUDIO_RELEASE: v0.0.11
        working-directory: speech-studio
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/speech-studio-runtime-${GITHUB_RUN_ID}"
          mkdir -p "$runtime_dir" src-tauri/binaries
          curl -sSL --fail \
            "https://github.com/soniqo/speech-studio/releases/download/${SPEECH_STUDIO_RELEASE}/Speech-Studio_0.0.11_aarch64.app.tar.gz" \
            -o "$runtime_dir/Speech-Studio.app.tar.gz"
          tar -xzf "$runtime_dir/Speech-Studio.app.tar.gz" -C "$runtime_dir"
          cp "$runtime_dir/Speech Studio.app/Contents/MacOS/soniqo-tts-sidecar" \
             src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin
          cp "$runtime_dir/Speech Studio.app/Contents/Resources/mlx.metallib" \
             src-tauri/binaries/mlx.metallib
          chmod +x src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin
          file src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin
          shasum -a 256 \
            src-tauri/binaries/soniqo-tts-sidecar-aarch64-apple-darwin \
            src-tauri/binaries/mlx.metallib

      - name: Run Rust tests
        working-directory: speech-studio/src-tauri
        run: cargo test --lib

      - name: Run frontend tests
        working-directory: speech-studio
        run: pnpm test

      - name: Type-check frontend
        working-directory: speech-studio
        run: pnpm exec tsc --noEmit

      - name: Build and ad-hoc sign custom app and DMG
        working-directory: speech-studio
        run: |
          set -euo pipefail
          pnpm tauri build --bundles app --config src-tauri/tauri.paragraph-mode.conf.json

          app="src-tauri/target/release/bundle/macos/Speech Studio Paragraph Mode.app"
          if [[ ! -e "$app/Contents/MacOS/mlx.metallib" ]]; then
            ln -s ../Resources/mlx.metallib "$app/Contents/MacOS/mlx.metallib"
          fi
          codesign --force --sign - --options runtime \
            --entitlements src-tauri/Entitlements.sidecar.plist \
            "$app/Contents/MacOS/soniqo-tts-sidecar"
          codesign --force --sign - --options runtime \
            --entitlements src-tauri/Entitlements.app.plist "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          dmg_root="${RUNNER_TEMP}/speech-studio-paragraph-dmg-${GITHUB_RUN_ID}"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          dmg="$dmg_dir/Speech-Studio-Paragraph-Mode_0.0.11_aarch64.dmg"
          mkdir -p "$dmg_root" "$dmg_dir"
          ditto "$app" "$dmg_root/Speech Studio Paragraph Mode.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -volname "Speech Studio Paragraph Mode" \
            -srcfolder "$dmg_root" -format UDZO -ov "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg"

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: speech-studio-paragraph-mode-macos-arm64-dmg
          path: speech-studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
